name: Update GitHub Activity Chart

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 90-day activity bars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from html import escape

          OWNER = "Oghenesuvwe-dev"
          TOKEN = os.environ["GH_TOKEN"]

          def api(path, params=None):
              url = "https://api.github.com" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Oghenesuvwe-profile-activity-chart",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API error ({exc.code}): {body[:300]}")

          end = datetime.now(timezone.utc).date()
          start = end - timedelta(days=89)
          daily = Counter()
          personal = Counter()
          page = 1
          aggregate_commits = 0

          while page <= 10:
              query = f"author:{OWNER} committer-date:>={start.isoformat()} committer-date:<={end.isoformat()}"
              results = api("/search/commits", {"q": query, "per_page": 100, "page": page})
              items = results.get("items", [])
              if not items:
                  break
              for item in items:
                  repo = item.get("repository", {})
                  full_name = repo.get("full_name")
                  raw_date = item.get("commit", {}).get("author", {}).get("date") or item.get("commit", {}).get("committer", {}).get("date")
                  if not full_name or not raw_date:
                      continue
                  commit_date = datetime.fromisoformat(raw_date.replace("Z", "+00:00")).date()
                  if not (start <= commit_date <= end):
                      continue
                  daily[commit_date] += 1
                  is_personal_public = (
                      full_name.lower().startswith(OWNER.lower() + "/")
                      and not repo.get("private", False)
                      and not repo.get("fork", False)
                  )
                  if is_personal_public:
                      personal[full_name] += 1
                  else:
                      aggregate_commits += 1
              if len(items) < 100:
                  break
              page += 1

          prs = int(api("/search/issues", {"q": f"author:{OWNER} type:pr created:>={start.isoformat()} created:<={end.isoformat()}", "per_page": 1}).get("total_count", 0))
          issues = int(api("/search/issues", {"q": f"author:{OWNER} type:issue created:>={start.isoformat()} created:<={end.isoformat()}", "per_page": 1}).get("total_count", 0))

          total = sum(daily.values())
          active = len(daily)
          max_count = max(daily.values(), default=1)

          W, H = 1000, 430
          left, right = 62, 34
          chart_x, chart_y = left, 164
          chart_w, chart_h = W - left - right, 150
          bar_gap = 3
          bar_w = (chart_w - (89 * bar_gap)) / 90

          def y_for(value):
              return chart_y + chart_h - (value / max_count * chart_h if max_count else 0)

          bars = []
          for i in range(90):
              date = start + timedelta(days=i)
              count = daily.get(date, 0)
              x = chart_x + i * (bar_w + bar_gap)
              y = y_for(count)
              h = chart_y + chart_h - y
              fill = "#39d353" if count else "#21262d"
              title = f"{count} commit{'s' if count != 1 else ''} — {date.strftime('%b %-d, %Y')}"
              bars.append(f'<rect x="{x:.2f}" y="{y:.2f}" width="{bar_w:.2f}" height="{max(h, 3):.2f}" rx="2" fill="{fill}"><title>{escape(title)}</title></rect>')

          # Month labels are derived from the 90-day range and placed below the axis.
          months = []
          cursor = start.replace(day=1)
          while cursor <= end:
              if cursor >= start:
                  idx = (cursor - start).days
                  x = chart_x + idx * (bar_w + bar_gap)
                  months.append(f'<text x="{x:.2f}" y="337" font-size="11" fill="#8b949e">{cursor.strftime("%b")}</text>')
              if cursor.month == 12:
                  cursor = cursor.replace(year=cursor.year + 1, month=1, day=1)
              else:
                  cursor = cursor.replace(month=cursor.month + 1, day=1)

          # Sparse horizontal guides keep the chart readable without overpowering the bars.
          guides = []
          for value in sorted(set([0, max_count, max(1, max_count // 2)])):
              y = chart_y + chart_h - (value / max_count * chart_h if max_count else 0)
              guides.append(f'<line x1="{chart_x}" y1="{y:.2f}" x2="{W-right}" y2="{y:.2f}" stroke="#30363d" stroke-width="1"/>')
              guides.append(f'<text x="{chart_x-12}" y="{y+4:.2f}" text-anchor="end" font-size="10" fill="#6e7681">{value}</text>')

          def card(x, number, label):
              return f'''<rect x="{x}" y="86" width="205" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
              <text x="{x+18}" y="112" font-size="21" font-weight="700" fill="#f0f6fc">{number}</text>
              <text x="{x+18}" y="130" font-size="10" fill="#8b949e">{label}</text>'''

          # Personal repository names are intentionally not rendered here. The 90-day bars
          # represent all visible authored commit activity; collaborative/restricted work is
          # only represented by aggregate metrics and never by repository identity.
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-labelledby="title desc">
          <title id="title">GitHub Activity — last 90 days</title>
          <desc id="desc">{total} commits across the last 90 days, {active} active days, {prs} pull requests, and {issues} issues. Repository identities outside public personal repositories are not displayed.</desc>
          <rect width="100%" height="100%" rx="18" fill="#0d1117"/>
          <text x="40" y="46" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#f0f6fc">GitHub Activity</text>
          <text x="40" y="67" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Last 90 days</text>
          <text x="960" y="49" text-anchor="end" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#39d353">{total} commits</text>
          {card(40, total, "Commits")}
          {card(255, active, "Active days")}
          {card(470, prs, "Pull requests")}
          {card(685, issues, "Issues")}
          {''.join(guides)}
          {''.join(bars)}
          <line x1="{chart_x}" y1="{chart_y+chart_h}" x2="{W-right}" y2="{chart_y+chart_h}" stroke="#30363d"/>
          {''.join(months)}
          <text x="{W-right}" y="337" text-anchor="end" font-size="10" fill="#6e7681">daily commits</text>
          <text x="40" y="385" font-size="10" fill="#6e7681">Each bar = one day · hover a bar for the exact commit count and date</text>
          <text x="960" y="385" text-anchor="end" font-size="10" fill="#6e7681">Collaborative / restricted activity remains unnamed</text>
          </svg>'''

          os.makedirs("public", exist_ok=True)
          with open("public/activity-chart.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          print(f"Generated 90-day activity chart: {total} commits, {active} active days, {prs} PRs, {issues} issues, {aggregate_commits} collaborative/restricted commits")
          PY

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/activity-chart.svg
          if git diff --cached --quiet; then
            echo "Activity chart is already current."
          else
            git commit -m "chore: refresh 90-day GitHub activity chart [skip ci]"
            git push
          fi
